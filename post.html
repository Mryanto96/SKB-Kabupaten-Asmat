<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Article | English Prime Course</title>
    <meta name="description" content="Read the full article from English Prime Course." />
    <meta name="author" content="English Prime Course" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="css/style.css" />

    <!-- KaTeX for math formulas -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.7/dist/katex.min.css">

    <style>
        /* ============================================================
           POST PAGE — Article Detail
           ============================================================ */

        :root {
            --emerald: #10b981;
            --emerald-dark: #059669;
            --emerald-soft: rgba(16, 185, 129, 0.10);
        }

        /* ---------- GRID LINES ---------- */
        body {
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(to right, rgba(15, 23, 42, 0.035) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(15, 23, 42, 0.035) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
            mask-image: radial-gradient(ellipse at center, black 40%, transparent 85%);
            -webkit-mask-image: radial-gradient(ellipse at center, black 40%, transparent 85%);
        }

        [data-theme="dark"] body::before {
            background-image:
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        }

        .page-content,
        .navbar,
        .mobile-menu,
        footer {
            position: relative;
            z-index: 1;
        }

        /* ---------- BREADCRUMB ---------- */
        .post-breadcrumb {
            padding: 24px 0 8px;
            font-size: 0.75rem;
            color: var(--text3);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
        }

        .post-breadcrumb a {
            color: var(--text2);
            text-decoration: none;
            transition: color 0.3s var(--ease-smooth);
        }

        .post-breadcrumb a:hover {
            color: var(--emerald);
        }

        .post-breadcrumb i {
            font-size: 0.6rem;
            opacity: 0.6;
        }

        /* ---------- ARTICLE CONTAINER ---------- */
        .article-container {
            max-width: 780px;
            margin: 0 auto;
            padding: 0 20px 60px;
        }

        /* ---------- ARTICLE HEADER ---------- */
        .article-header {
            padding: 24px 0 32px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 32px;
        }

        .article-category {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 14px;
            border-radius: 99px;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            color: #fff;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(15, 23, 42, 0.15);
        }

        .article-title {
            font-size: clamp(1.5rem, 1.2rem + 2vw, 2.5rem);
            font-weight: 800;
            line-height: 1.15;
            letter-spacing: -0.8px;
            color: var(--text);
            margin-bottom: 20px;
        }

        .article-lead {
            font-size: clamp(1rem, 0.95rem + 0.3vw, 1.125rem);
            color: var(--text2);
            line-height: 1.65;
            margin-bottom: 24px;
        }

        /* ---------- ARTICLE META ---------- */
        .article-meta {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 20px;
            font-size: 0.85rem;
            color: var(--text2);
        }

        .article-author {
            display: inline-flex;
            align-items: center;
            gap: 12px;
        }

        .article-author-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--emerald);
            color: #fff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.95rem;
            flex-shrink: 0;
            letter-spacing: 0.5px;
        }

        .article-author-info {
            display: flex;
            flex-direction: column;
            line-height: 1.3;
        }

        .article-author-name {
            font-weight: 600;
            color: var(--text);
            font-size: 0.875rem;
        }

        .article-author-role {
            font-size: 0.75rem;
            color: var(--text3);
        }

        .article-meta-divider {
            width: 1px;
            height: 32px;
            background: var(--border);
        }

        .article-meta-item {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
        }

        .article-meta-item i {
            color: var(--emerald);
            font-size: 0.8rem;
        }

        /* ---------- COVER IMAGE ---------- */
        .article-cover {
            margin-bottom: 40px;
            border-radius: var(--radius);
            overflow: hidden;
            background: var(--bg3);
            box-shadow: 0 8px 32px rgba(15, 23, 42, 0.10);
        }

        .article-cover img {
            width: 100%;
            height: auto;
            max-height: 540px;
            object-fit: cover;
            display: block;
        }

        /* ---------- ARTICLE CONTENT ---------- */
        .article-content {
            font-size: 1.0625rem;
            line-height: 1.8;
            color: var(--text);
        }

        .article-content>p:first-of-type {
            font-size: 1.125rem;
            color: var(--text);
            line-height: 1.75;
        }

        .article-content p {
            margin-bottom: 1.5em;
        }

        .article-content h2 {
            font-size: clamp(1.25rem, 1.1rem + 0.8vw, 1.6rem);
            font-weight: 700;
            line-height: 1.3;
            letter-spacing: -0.3px;
            color: var(--text);
            margin-top: 2em;
            margin-bottom: 1em;
        }

        .article-content h3 {
            font-size: clamp(1.125rem, 1rem + 0.5vw, 1.35rem);
            font-weight: 700;
            line-height: 1.35;
            color: var(--text);
            margin-top: 1.75em;
            margin-bottom: 0.75em;
        }

        .article-content h4 {
            font-size: 1.1rem;
            font-weight: 600;
            margin-top: 1.5em;
            margin-bottom: 0.5em;
        }

        .article-content strong {
            color: var(--text);
            font-weight: 700;
        }

        .article-content em {
            font-style: italic;
        }

        .article-content a {
            color: var(--emerald-dark);
            text-decoration: underline;
            text-underline-offset: 3px;
            text-decoration-thickness: 1.5px;
            transition: color 0.3s var(--ease-smooth);
        }

        .article-content a:hover {
            color: var(--emerald);
        }

        /* Blockquote */
        .article-content blockquote {
            position: relative;
            margin: 2em 0;
            padding: 24px 28px 24px 60px;
            background: var(--emerald-soft);
            border-left: 4px solid var(--emerald);
            border-radius: 0 12px 12px 0;
            font-size: 1.0625rem;
            font-style: italic;
            color: var(--text);
            line-height: 1.7;
        }

        .article-content blockquote::before {
            content: '"';
            position: absolute;
            top: 14px;
            left: 20px;
            font-size: 3rem;
            font-family: Georgia, serif;
            color: var(--emerald);
            opacity: 0.4;
            line-height: 1;
        }

        .article-content blockquote p:last-child {
            margin-bottom: 0;
        }

        /* Lists */
        .article-content ul,
        .article-content ol {
            margin: 1.5em 0;
            padding-left: 1.75em;
        }

        .article-content li {
            margin-bottom: 0.75em;
            padding-left: 0.25em;
        }

        .article-content ul li::marker {
            color: var(--emerald);
        }

        .article-content ol li::marker {
            color: var(--emerald);
            font-weight: 700;
        }

        /* Code */
        .article-content code {
            background: var(--bg3);
            color: var(--emerald-dark);
            padding: 2px 8px;
            border-radius: 4px;
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            font-size: 0.875em;
            font-weight: 500;
        }

        .article-content pre {
            background: #0f172a;
            color: #e2e8f0;
            padding: 20px;
            border-radius: 12px;
            overflow-x: auto;
            margin: 1.75em 0;
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            font-size: 0.875rem;
            line-height: 1.6;
        }

        .article-content pre code {
            background: transparent;
            color: inherit;
            padding: 0;
        }

        /* Table */
        .article-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 1.75em 0;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(15, 23, 42, 0.05);
            display: block;
            overflow-x: auto;
        }

        .article-content table thead {
            background: var(--emerald);
        }

        .article-content table th {
            padding: 12px 16px;
            text-align: left;
            color: #fff;
            font-weight: 700;
            font-size: 0.875rem;
            border: none;
        }

        .article-content table td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            font-size: 0.9375rem;
        }

        .article-content table tbody tr:nth-child(even) {
            background: var(--bg2);
        }

        .article-content table tbody tr:last-child td {
            border-bottom: none;
        }

        /* Images inside content */
        .article-content img {
            max-width: 100%;
            height: auto;
            border-radius: 12px;
            margin: 1.75em 0;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.10);
        }

        /* Horizontal rule */
        .article-content hr {
            border: none;
            height: 1px;
            background: linear-gradient(to right, transparent, var(--border), transparent);
            margin: 2.5em 0;
        }

        /* ---------- TAGS ---------- */
        .article-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 48px;
            padding-top: 32px;
            border-top: 1px solid var(--border);
        }

        .article-tag {
            padding: 6px 14px;
            background: var(--bg2);
            color: var(--text2);
            border-radius: 99px;
            font-size: 0.75rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s var(--ease-smooth);
        }

        .article-tag:hover {
            background: var(--emerald-soft);
            color: var(--emerald-dark);
        }

        .article-tag::before {
            content: '#';
            margin-right: 4px;
            opacity: 0.5;
        }

        /* ---------- SHARE ---------- */
        .article-share {
            margin-top: 32px;
            padding: 24px;
            background: var(--bg2);
            border-radius: var(--radius);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .article-share-label {
            font-weight: 600;
            font-size: 0.875rem;
            color: var(--text);
        }

        .article-share-buttons {
            display: flex;
            gap: 8px;
        }

        .share-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: var(--card-bg);
            color: var(--text2);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.95rem;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s var(--ease-smooth);
        }

        .share-btn:hover {
            background: var(--emerald);
            color: #fff;
            border-color: var(--emerald);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(16, 185, 129, 0.3);
        }

        /* ---------- RELATED ARTICLES ---------- */
        .related-section {
            max-width: 1000px;
            margin: 64px auto 0;
            padding: 0 20px;
        }

        .related-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .related-title i {
            color: var(--emerald);
        }

        .related-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-bottom: 40px;
        }

        @media (min-width: 640px) {
            .related-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .related-card {
            display: flex;
            flex-direction: column;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            text-decoration: none;
            color: inherit;
            transition: all 0.3s var(--ease-smooth);
        }

        .related-card:hover {
            border-color: var(--emerald);
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(15, 23, 42, 0.08);
        }

        .related-image {
            aspect-ratio: 16 / 10;
            background: var(--bg3);
            overflow: hidden;
        }

        .related-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s var(--ease-smooth);
        }

        .related-card:hover .related-image img {
            transform: scale(1.05);
        }

        .related-body {
            padding: 16px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .related-cat {
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .related-card h4 {
            font-size: 0.9375rem;
            font-weight: 700;
            line-height: 1.4;
            color: var(--text);
            margin-bottom: 8px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            transition: color 0.3s var(--ease-smooth);
        }

        .related-card:hover h4 {
            color: var(--emerald-dark);
        }

        .related-date {
            font-size: 0.7rem;
            color: var(--text3);
            margin-top: auto;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* ---------- DROP CAP ---------- */
        .article-content .drop-cap {
            font-size: 30px;
            font-weight: 800;
            color: #ef4444;
            float: left;
            line-height: 1;
            padding: 6px 12px 0 0;
            letter-spacing: -1px;
        }

        /* ---------- BACK BUTTON ---------- */
        .article-bottom {
            text-align: center;
            margin-top: 40px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 28px;
            background: var(--card-bg);
            border: 1.5px solid var(--border);
            border-radius: var(--radius-pill);
            color: var(--text);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 600;
            transition: all 0.3s var(--ease-smooth);
        }

        .back-btn:hover {
            background: var(--emerald);
            color: #fff;
            border-color: var(--emerald);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.3);
        }

        /* ---------- ERROR STATE ---------- */
        .error-state {
            text-align: center;
            padding: 100px 20px;
            max-width: 480px;
            margin: 0 auto;
        }

        .error-state-icon {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: var(--bg3);
            color: var(--text3);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin-bottom: 24px;
        }

        .error-state h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--text);
        }

        .error-state p {
            color: var(--text2);
            margin-bottom: 28px;
            line-height: 1.6;
        }

        /* ---------- LOADING ---------- */
        .loading-state {
            text-align: center;
            padding: 100px 20px;
        }

        .loading-spinner {
            width: 44px;
            height: 44px;
            border: 3px solid var(--border);
            border-top-color: var(--emerald);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ---------- READING PROGRESS ---------- */
        .reading-progress {
            position: fixed;
            top: 0;
            left: 0;
            height: 3px;
            background: linear-gradient(to right, var(--emerald), #34d399);
            width: 0%;
            z-index: 9999;
            transition: width 0.1s linear;
        }

        /* ---------- RESPONSIVE ---------- */
        @media (max-width: 640px) {
            .article-meta {
                gap: 12px;
            }

            .article-meta-divider {
                display: none;
            }

            .article-content {
                font-size: 1rem;
                line-height: 1.75;
            }

            .article-content blockquote {
                padding: 18px 20px 18px 48px;
                font-size: 1rem;
            }

            .article-share {
                flex-direction: column;
                align-items: flex-start;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .reading-progress {
                display: none;
            }
        }
    </style>
</head>

<body>

    <!-- Reading Progress Bar -->
    <div class="reading-progress" id="readingProgress"></div>

    <div class="page-content">
        <!-- Article Container -->
        <article id="articleContainer">
            <div class="loading-state">
                <div class="loading-spinner"></div>
                <p style="color: var(--text2);">Loading article...</p>
            </div>
        </article>

        <!-- Related Articles (in-jected by JS) -->
        <div id="relatedContainer"></div>

        <!-- Footer -->
        <footer style="border-top: 1px solid var(--border); background: var(--bg2); margin-top: 64px;">
            <div class="container">
                <div style="padding: 32px 0 16px; text-align: center;">
                    <p style="font-size: 0.82rem; color: var(--text2); margin: 0;">
                        © <span data-year>2026</span> English Prime Course. All Rights Are Reserved.
                    </p>
                    <p style="font-size: 0.72rem; margin-top: 6px; color: var(--text3);">
                        Designed by
                        <a href="https://guru-kreatif.vercel.app/" target="_blank" rel="noopener noreferrer">
                            <strong>Yantho Rundy</strong> 💗
                        </a>
                    </p>
                </div>
            </div>
        </footer>

    </div>

    <!-- ============================================================
         SCRIPTS
         ============================================================ -->
    <script src="js/blog-data.js"></script>
    <script src="js/post-page.js"></script>
    <script src="js/main.js" defer></script>
    <script src="js/navbar.js" defer></script>

    <!-- KaTeX (auto-render) -->
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.7/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.7/dist/contrib/auto-render.min.js"></script>

</body>

</html>
