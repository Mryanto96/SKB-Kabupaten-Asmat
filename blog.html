<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog | English Prime Course</title>
    <meta name="description"
        content="Articles, stories, and updates from English Prime Course — where learning meets real life." />
    <meta name="author" content="English Prime Course" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="css/style.css" />

    <style>
        /* ============================================================
           BLOG PAGE — News Layout with Sidebar
           ============================================================ */

        :root {
            --emerald: #10b981;
            --emerald-dark: #059669;
            --emerald-soft: rgba(16, 185, 129, 0.10);
        }

        /* ---------- SUBTLE GRID LINES ---------- */
        body {
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(to right, rgba(15, 23, 42, 0.035) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(15, 23, 42, 0.035) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
            mask-image: radial-gradient(ellipse at center, black 40%, transparent 85%);
            -webkit-mask-image: radial-gradient(ellipse at center, black 40%, transparent 85%);
        }

        [data-theme="dark"] body::before {
            background-image:
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        }

        .page-content,
        .navbar,
        .mobile-menu,
        footer {
            position: relative;
            z-index: 1;
        }

        /* ---------- PAGE HEADER ---------- */
        .blog-header {
            padding: 80px 0 48px;
            text-align: center;
        }

        .blog-header .section-label {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
        }

        .blog-header .section-label::before,
        .blog-header .section-label::after {
            content: '';
            width: 24px;
            height: 1px;
            background: var(--border);
        }

        .blog-header .section-title {
            margin-bottom: 16px;
        }

        .blog-header .section-desc {
            margin: 0 auto;
        }

        /* ============================================================
           MAIN LAYOUT — 2 KOLOM (Konten + Sidebar)
           ============================================================ */
        .blog-layout {
            display: grid;
            grid-template-columns: 1fr;
            gap: 32px;
            align-items: start;
            padding-top: 8px;
        }

        @media (min-width: 1024px) {
            .blog-layout {
                grid-template-columns: minmax(0, 1fr) 320px;
                gap: 40px;
            }
        }

        /* ============================================================
           KOLOM KIRI — Featured + Grid
           ============================================================ */
        .blog-main {
            min-width: 0;
        }

        /* ---------- FEATURED SECTION ---------- */
        .featured-section {
            margin-bottom: 32px;
        }

        .featured-label {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--emerald);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 14px;
        }

        .featured-label::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(to right, var(--border), transparent);
        }

        .featured-card {
            display: grid;
            grid-template-columns: 1fr;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            transition: border-color 0.4s var(--ease-smooth),
                box-shadow 0.4s var(--ease-smooth),
                transform 0.4s var(--ease-smooth);
            text-decoration: none;
            color: inherit;
            position: relative;
        }

        .featured-card:hover {
            border-color: var(--emerald);
            box-shadow: 0 12px 32px rgba(16, 185, 129, 0.15);
            transform: translateY(-4px);
        }

        .featured-media {
            position: relative;
            aspect-ratio: 16 / 10;
            background: var(--bg3);
            overflow: hidden;
        }

        .featured-media img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s var(--ease-smooth);
        }

        .featured-card:hover .featured-media img {
            transform: scale(1.04);
        }

        .featured-badge {
            position: absolute;
            top: 14px;
            left: 14px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            background: var(--emerald);
            color: #fff;
            border-radius: 99px;
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
            z-index: 2;
        }

        .featured-body {
            padding: 24px;
            display: flex;
            flex-direction: column;
        }

        .featured-cat {
            display: inline-flex;
            align-self: flex-start;
            padding: 3px 10px;
            background: var(--emerald-soft);
            color: var(--emerald-dark);
            border-radius: 99px;
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            margin-bottom: 14px;
        }

        .featured-title {
            font-size: clamp(1.15rem, 1rem + 0.8vw, 1.5rem);
            font-weight: 700;
            line-height: 1.25;
            letter-spacing: -0.4px;
            color: var(--text);
            margin-bottom: 12px;
            transition: color 0.3s var(--ease-smooth);
        }

        .featured-card:hover .featured-title {
            color: var(--emerald-dark);
        }

        .featured-excerpt {
            font-size: 0.9rem;
            color: var(--text2);
            line-height: 1.65;
            margin-bottom: 16px;
        }

        .featured-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            font-size: 0.72rem;
            color: var(--text3);
            padding-top: 14px;
            border-top: 1px solid var(--border);
        }

        .featured-meta span {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-weight: 500;
        }

        .featured-meta i {
            color: var(--emerald);
        }

        /* ---------- BLOG GRID ---------- */
        .blog-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 24px;
        }

        @media (min-width: 640px) {
            .blog-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* ---------- BLOG CARD ---------- */
        .blog-card {
            display: flex;
            flex-direction: column;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            text-decoration: none;
            color: inherit;
            transition: transform 0.4s var(--ease-smooth),
                box-shadow 0.4s var(--ease-smooth),
                border-color 0.4s var(--ease-smooth);
            position: relative;
        }

        .blog-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 32px rgba(15, 23, 42, 0.10);
            border-color: var(--emerald);
        }

        .blog-card-media {
            aspect-ratio: 16 / 10;
            background: var(--bg3);
            overflow: hidden;
            position: relative;
        }

        .blog-card-media img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s var(--ease-smooth);
            display: block;
        }

        .blog-card:hover .blog-card-media img {
            transform: scale(1.05);
        }

        .blog-card-cat {
            position: absolute;
            top: 12px;
            left: 12px;
            padding: 4px 10px;
            border-radius: 99px;
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: #fff;
            box-shadow: 0 2px 8px rgba(15, 23, 42, 0.2);
            z-index: 2;
        }

        .blog-card-cat.news {
            background: #3b82f6;
        }

        .blog-card-cat.event {
            background: #f59e0b;
        }

        .blog-card-cat.achievement {
            background: #ef4444;
        }

        .blog-card-cat.activity {
            background: #8b5cf6;
        }

        .blog-card-cat.workshop {
            background: #06b6d4;
        }

        .blog-card-cat.tips {
            background: #10b981;
        }

        .blog-card-body {
            padding: 18px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .blog-card-title {
            font-size: 1rem;
            font-weight: 700;
            line-height: 1.35;
            letter-spacing: -0.2px;
            color: var(--text);
            margin-bottom: 10px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            transition: color 0.3s var(--ease-smooth);
        }

        .blog-card:hover .blog-card-title {
            color: var(--emerald-dark);
        }

        .blog-card-excerpt {
            font-size: 0.82rem;
            color: var(--text2);
            line-height: 1.6;
            margin-bottom: 14px;
            flex: 1;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .blog-card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
            font-size: 0.7rem;
            color: var(--text3);
            font-weight: 500;
        }

        .blog-card-footer span {
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .blog-card-footer i {
            font-size: 0.68rem;
        }

        /* ============================================================
           KOLOM KANAN — SIDEBAR
           ============================================================ */
        .blog-sidebar {
            position: sticky;
            top: calc(var(--nav-h, 68px) + 24px);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        @media (max-width: 1023px) {
            .blog-sidebar {
                position: static;
            }
        }

        .sidebar-panel {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
        }

        .sidebar-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--emerald);
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .sidebar-title i {
            color: var(--emerald);
            font-size: 0.85rem;
        }

        /* ---------- ARTIKEL VERTIKAL (SIDEBAR LIST) ---------- */
        .sidebar-articles {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .sidebar-article {
            display: flex;
            gap: 12px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
            text-decoration: none;
            color: inherit;
            transition: transform 0.3s var(--ease-smooth);
        }

        .sidebar-article:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .sidebar-article:hover {
            transform: translateX(4px);
        }

        .sidebar-article-img {
            width: 70px;
            height: 70px;
            border-radius: 8px;
            overflow: hidden;
            flex-shrink: 0;
            background: var(--bg3);
            position: relative;
        }

        .sidebar-article-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s var(--ease-smooth);
        }

        .sidebar-article:hover .sidebar-article-img img {
            transform: scale(1.08);
        }

        .sidebar-article-body {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .sidebar-article-cat {
            font-size: 0.6rem;
            font-weight: 700;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            color: var(--emerald);
            margin-bottom: 4px;
        }

        .sidebar-article-title {
            font-size: 0.82rem;
            font-weight: 600;
            line-height: 1.35;
            color: var(--text);
            margin-bottom: 4px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            transition: color 0.3s var(--ease-smooth);
        }

        .sidebar-article:hover .sidebar-article-title {
            color: var(--emerald-dark);
        }

        .sidebar-article-date {
            font-size: 0.65rem;
            color: var(--text3);
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        /* ---------- SIDEBAR: KATEGORI LIST ---------- */
        .sidebar-cats {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .sidebar-cat-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            background: var(--bg2);
            border-radius: 8px;
            text-decoration: none;
            color: var(--text2);
            font-size: 0.8rem;
            font-weight: 500;
            transition: all 0.3s var(--ease-smooth);
            cursor: pointer;
            border: none;
            font-family: inherit;
            text-align: left;
            width: 100%;
        }

        .sidebar-cat-item:hover {
            background: var(--emerald-soft);
            color: var(--emerald-dark);
            transform: translateX(4px);
        }

        .sidebar-cat-item .cat-count {
            padding: 2px 8px;
            background: var(--emerald);
            color: #fff;
            border-radius: 99px;
            font-size: 0.68rem;
            font-weight: 700;
        }

        /* ---------- LOAD MORE ---------- */
        .loadmore-wrap {
            text-align: center;
            margin-top: 32px;
        }

        .loadmore-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 28px;
            background: var(--card-bg);
            border: 1.5px solid var(--border);
            border-radius: var(--radius-pill);
            color: var(--text);
            font-family: inherit;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s var(--ease-smooth);
        }

        .loadmore-btn:hover {
            background: var(--emerald);
            color: #fff;
            border-color: var(--emerald);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.3);
        }

        .loadmore-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .article-counter {
            display: block;
            margin-top: 12px;
            font-size: 0.75rem;
            color: var(--text3);
        }

        .article-counter strong {
            color: var(--text);
        }

        /* ---------- EMPTY STATE ---------- */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 80px 20px;
            background: var(--bg2);
            border-radius: var(--radius);
            border: 2px dashed var(--border);
        }

        .empty-state i {
            font-size: 3rem;
            color: var(--text3);
            margin-bottom: 16px;
            display: inline-block;
        }

        .empty-state h3 {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 8px;
        }

        .empty-state p {
            font-size: 0.875rem;
            color: var(--text2);
        }

        /* ---------- RESPONSIVE ---------- */
        @media (max-width: 640px) {
            .blog-header {
                padding: 60px 0 40px;
            }

            .blog-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="page-content">

        <!-- ============================================================
             PAGE HEADER
             ============================================================ -->
        <section class="blog-header">
            <div class="container">
                <p class="section-label">Blog & Articles</p>
                <h1 class="section-title">
                    Stories from <span class="gradient-text">English Prime Course</span>
                </h1>
                <p class="section-desc" style="margin: 0 auto;">
                    Articles, activities, and updates from our learning community —
                    where learning meets real life.
                </p>
            </div>
        </section>

        <!-- ============================================================
             LAYOUT (GRID + SIDEBAR)
             ============================================================ -->
        <section class="section" style="padding-top: 0;">
            <div class="container">

                <!-- 2-Column Layout -->
                <div class="blog-layout">

                    <!-- KIRI: Featured + Grid -->
                    <div class="blog-main">

                        <!-- Featured -->
                        <section class="featured-section" id="featuredSection" style="display:none;">
                            <div class="featured-label">
                                <i class="fas fa-star"></i>
                                Featured Article
                            </div>
                            <div id="featuredContent"></div>
                        </section>

                        <!-- Grid -->
                        <div class="blog-grid" id="blogGrid">
                            <!-- Cards in-jected by JS -->
                        </div>

                        <!-- Load More -->
                        <div class="loadmore-wrap" id="loadmoreWrap" style="display:none;">
                            <button class="loadmore-btn" id="loadmoreBtn" type="button">
                                <span>Load More Articles</span>
                                <i class="fas fa-arrow-down"></i>
                            </button>
                            <span class="article-counter" id="articleCounter"></span>
                        </div>

                    </div>

                    <!-- KANAN: Sidebar -->
                    <aside class="blog-sidebar">

                        <!-- Sidebar: Artikel Terbaru -->
                        <div class="sidebar-panel">
                            <h3 class="sidebar-title">
                                <i class="fas fa-clock"></i>
                                Latest Articles
                            </h3>
                            <div class="sidebar-articles" id="sidebarArticles">
                                <!-- In-jected by JS -->
                            </div>
                        </div>

                        <!-- Sidebar: Kategori -->
                        <div class="sidebar-panel">
                            <h3 class="sidebar-title">
                                <i class="fas fa-tags"></i>
                                Categories
                            </h3>
                            <div class="sidebar-cats" id="sidebarCategories">
                                <!-- In-jected by JS -->
                            </div>
                        </div>

                    </aside>

                </div>

            </div>
        </section>

        <!-- ============================================================
             FOOTER
             ============================================================ -->
        <footer style="border-top: 1px solid var(--border); background: var(--bg2);">
            <div class="container">
                <div style="padding: 32px 0 16px; text-align: center;">
                    <p style="font-size: 0.82rem; color: var(--text2); margin: 0;">
                        © <span data-year>2026</span> English Prime Course. All Rights Are Reserved.
                    </p>
                    <p style="font-size: 0.72rem; margin-top: 6px; color: var(--text3);">
                        Designed by
                        <a href="https://guru-kreatif.vercel.app/" target="_blank" rel="noopener noreferrer">
                            <strong>Yantho Rundy</strong> 💗
                        </a>
                    </p>
                </div>
            </div>
        </footer>

    </div>

    <!-- ============================================================
         SCRIPTS
         ============================================================ -->
    <script src="js/blog-data.js"></script>
    <script src="js/blog-page.js"></script>
    <script src="js/main.js" defer></script>
    <script src="js/navbar.js" defer></script>

</body>

</html>
